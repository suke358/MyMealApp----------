<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MyMeal おかず提案ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 32px;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: -2px;
            margin-bottom: 24px;
            font-size: 13px;
            letter-spacing: 0.08em;
        }

        .form-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 18px 12px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            background: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .category-btn.beef.active {
            border-color: #e74c3c;
            background: #e74c3c;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .category-btn.pork.active {
            border-color: #f39c12;
            background: #f39c12;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .category-btn.chicken.active {
            border-color: #e67e22;
            background: #e67e22;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .category-btn.fish.active {
            border-color: #3498db;
            background: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .category-btn.vegetable.active {
            border-color: #27ae60;
            background: #27ae60;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .category-btn.other.active {
            border-color: #9b59b6;
            background: #9b59b6;
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            min-height: 60px;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .meals-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .meals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .meals-header h2 {
            font-size: 24px;
            color: #333;
        }

        .menu-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #f1f3f5;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #888;
        }

        .clear-btn {
            padding: 10px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:active {
            transform: scale(0.95);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box {
            flex: 1 1 100%;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 40px 14px 16px;
            border-radius: 999px;
            border: 2px solid #e0e0e0;
            font-size: 15px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-chip {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid #e0e0e0;
            background: #f8f9fa;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip.active {
            background: #ffb347;
            border-color: #ff9a3c;
            color: white;
            box-shadow: 0 3px 10px rgba(255, 154, 60, 0.4);
        }

        .suggestion-wrapper {
            margin: 8px 0 18px;
            padding: 14px 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .suggestion-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .suggestion-title {
            font-size: 16px;
            font-weight: 700;
            color: #7b341e;
        }

        .suggestion-btn {
            padding: 10px 16px;
            border-radius: 999px;
            border: none;
            background: #ff7e5f;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 126, 95, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .suggestion-btn:active {
            transform: scale(0.96);
        }

        .suggestion-note {
            font-size: 12px;
            color: rgba(123, 52, 30, 0.8);
        }

        .suggestion-card {
            margin-top: 8px;
            border-radius: 18px;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }

        .suggestion-label {
            font-size: 12px;
            color: #ff7e5f;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .suggestion-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #333;
        }

        .suggestion-category {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }

        .suggestion-ingredients {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .menu-section-title {
            margin: 18px 0 10px;
            font-size: 15px;
            font-weight: 700;
            color: #555;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .menu-section-title span {
            font-size: 13px;
            font-weight: 500;
            margin-left: 8px;
            color: #aaa;
        }

        .meal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }

        .meal-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 8px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .meal-item.beef {
            border-left-color: #e74c3c;
        }

        .meal-item.pork {
            border-left-color: #f39c12;
        }

        .meal-item.chicken {
            border-left-color: #e67e22;
        }

        .meal-item.fish {
            border-left-color: #3498db;
        }

        .meal-item.vegetable {
            border-left-color: #27ae60;
        }

        .meal-item.other {
            border-left-color: #9b59b6;
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .meal-category {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        .meal-category.beef {
            background: #e74c3c;
        }

        .meal-category.pork {
            background: #f39c12;
        }

        .meal-category.chicken {
            background: #e67e22;
        }

        .meal-category.fish {
            background: #3498db;
        }

        .meal-category.vegetable {
            background: #27ae60;
        }

        .meal-category.other {
            background: #9b59b6;
        }

        .meal-name {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .meal-ingredients {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .meal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-btn, .delete-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: #3498db;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .edit-btn:active, .delete-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 18px;
        }

        .date-info {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }

        .no-result-hint {
            text-align: center;
            padding: 24px 16px;
            color: #999;
            font-size: 14px;
        }

        .favorite-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ffe08a;
            color: #8b5e00;
            font-weight: 700;
            font-size: 12px;
            margin-left: 6px;
        }

        .loading-state {
            text-align: center;
            padding: 30px 16px;
            color: #666;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 20;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }

        @media (max-width: 480px) {
            .category-buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ MyMeal おかず提案ツール</h1>
        <p class="subtitle">その日の気分や冷蔵庫の中から、ぴったりのおかずをパッと決めるメニュー表</p>
        
        <div class="form-section">
            <div class="form-group">
                <label>カテゴリー</label>
                <div class="category-buttons">
                    <button class="category-btn beef" data-category="牛">🐄 牛</button>
                    <button class="category-btn pork" data-category="豚">🐷 豚</button>
                    <button class="category-btn chicken" data-category="鶏">🐔 鶏</button>
                    <button class="category-btn fish" data-category="魚">🐟 魚</button>
                    <button class="category-btn vegetable" data-category="野菜">🥬 野菜</button>
                    <button class="category-btn other" data-category="その他">🍽️ その他</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="mealName">食事名</label>
                <input type="text" id="mealName" placeholder="例：ハンバーグ定食">
            </div>
            
            <div class="form-group">
                <label for="mainIngredient">メイン食材</label>
                <input type="text" id="mainIngredient" placeholder="例：牛肉 / 鶏むね / さば缶 など">
            </div>
            
            <div class="form-group">
                <label for="memo">メモ・材料</label>
                <textarea id="memo" placeholder="例：牛肉、玉ねぎ、パン粉、卵..."></textarea>
            </div>

            <div class="form-group" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                <div style="flex:1 1 160px;">
                    <label for="lastAte">最後に食べた日</label>
                    <input type="date" id="lastAte">
                </div>
                <label style="display:flex; align-items:center; gap:8px; font-weight:600; color:#333; cursor:pointer;">
                    <input type="checkbox" id="favorite" style="width:20px; height:20px;"> お気に入り
                </label>
            </div>
            
            <button class="save-btn" id="saveBtn">保存</button>
        </div>
        
        <div class="meals-section">
            <div class="meals-header">
                <div>
                    <h2>おかずメニュー表</h2>
                    <span class="menu-badge">TODAY'S SPECIAL</span>
                </div>
                <button class="clear-btn" id="clearBtn">全削除</button>
            </div>

            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="食材名や料理名でさがす（例：鶏、にんじん、味噌）">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="filter-chips" id="filterChips">
                    <button class="filter-chip active" data-filter="all">すべて</button>
                    <button class="filter-chip" data-filter="肉">肉料理</button>
                    <button class="filter-chip" data-filter="魚">魚料理</button>
                    <button class="filter-chip" data-filter="野菜">野菜</button>
                    <button class="filter-chip" data-filter="その他">その他</button>
                </div>
            </div>

            <div class="suggestion-wrapper">
                <div class="suggestion-top">
                    <div class="suggestion-title">今日のおかずを相談する</div>
                    <button class="suggestion-btn" id="suggestBtn">
                        🎲 今日のおかず
                    </button>
                </div>
                <p class="suggestion-note">登録済みのおかずの中から、いまの条件に合う一品をランダムでご提案します。</p>
                <div id="suggestionArea"></div>
            </div>

            <div id="mealsList"></div>
        </div>
    </div>

    <script>
        // 設定
        const API_URL = 'https://script.google.com/macros/s/AKfycbyTqlvUn6xbUJAwUO_piVGiUHyNtii6Pp3UgCoT06dZuBqqypqktz10RF0ZXJodZ-l_/exec';

        // データ管理
        let meals = [];
        let editingIndex = -1;
        let searchKeyword = '';
        let filterCategory = 'all'; // all, 肉, 魚, 野菜, その他
        let isLoading = false;

        // カテゴリーボタンの処理
        let selectedCategory = '';
        const categoryButtons = document.querySelectorAll('.category-btn');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.category;
            });
        });

        // 保存ボタンの処理
        const saveBtn = document.getElementById('saveBtn');
        const mealNameInput = document.getElementById('mealName');
        const mainIngredientInput = document.getElementById('mainIngredient');
        const memoInput = document.getElementById('memo');
        const lastAteInput = document.getElementById('lastAte');
        const favoriteInput = document.getElementById('favorite');
        const searchInput = document.getElementById('searchInput');
        const filterChips = document.querySelectorAll('#filterChips .filter-chip');
        const suggestBtn = document.getElementById('suggestBtn');
        const suggestionArea = document.getElementById('suggestionArea');
        const toastEl = document.createElement('div');
        toastEl.id = 'toast';
        toastEl.className = 'toast';
        document.body.appendChild(toastEl);

        saveBtn.addEventListener('click', async () => {
            const mealName = mealNameInput.value.trim();
            const mainIngredient = mainIngredientInput.value.trim();
            const memo = memoInput.value.trim();
            const lastAte = lastAteInput.value;
            const favorite = favoriteInput.checked;

            if (!selectedCategory) {
                alert('カテゴリーを選択してください');
                return;
            }

            if (!mealName) {
                alert('食事名を入力してください');
                return;
            }

            const now = new Date();
            const meal = {
                id: editingIndex >= 0 && meals[editingIndex]?.id ? meals[editingIndex].id : `id-${Date.now()}`,
                createdAt: editingIndex >= 0 && meals[editingIndex]?.createdAt ? meals[editingIndex].createdAt : now.toISOString(),
                category: selectedCategory,
                name: mealName,
                mainIngredient: mainIngredient,
                memo: memo,
                favorite: favorite,
                lastAte: lastAte || '',
            };

            try {
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中...';
                await saveMealToSheet(meal);
                showToast('スプレッドシートに保存しました！');
                await fetchMealsFromSheet(); // 最新を再取得
            } catch (e) {
                alert('保存に失敗しました。時間をおいて再度お試しください。');
                console.error(e);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = editingIndex >= 0 ? '更新' : '保存';
            }

            resetForm();
        });

        // フォームをリセット
        function resetForm() {
            mealNameInput.value = '';
            mainIngredientInput.value = '';
            memoInput.value = '';
            lastAteInput.value = '';
            favoriteInput.checked = false;
            selectedCategory = '';
            categoryButtons.forEach(b => b.classList.remove('active'));
            editingIndex = -1;
            saveBtn.textContent = '保存';
        }

        // 現在の検索・絞り込み条件に合う配列を取得
        function getFilteredMeals() {
            return meals.filter(meal => {
                // カテゴリーフィルター
                if (filterCategory !== 'all') {
                    const highLevel = getHighLevelCategory(meal.category);
                    if (highLevel !== filterCategory) return false;
                }

                // キーワード検索（料理名・食材）
                if (searchKeyword) {
                    const kw = searchKeyword.toLowerCase();
                    const target = (meal.name + ' ' + (meal.mainIngredient || '') + ' ' + (meal.memo || '')).toLowerCase();
                    if (!target.includes(kw)) return false;
                }

                return true;
            });
        }

        // 食事リストを表示（レストランメニュー風）
        function renderMeals() {
            const mealsList = document.getElementById('mealsList');
            
            if (isLoading) {
                mealsList.innerHTML = '<div class="loading-state">読み込み中...</div>';
                return;
            }

            if (meals.length === 0) {
                mealsList.innerHTML = '<div class="empty-state">まだおかずが登録されていません。<br>上のフォームから、いつもの定番や作ってみたい料理を登録しましょう。</div>';
                suggestionArea.innerHTML = '';
                return;
            }

            const filtered = getFilteredMeals();

            if (filtered.length === 0) {
                mealsList.innerHTML = '<div class="no-result-hint">条件に合うおかずがありません。<br>検索ワードやカテゴリーを少しゆるめてみてください。</div>';
                suggestionArea.innerHTML = '';
                return;
            }

            // カテゴリーごとにまとめる（表示は 牛・豚・鶏 をまとめて「肉」セクションに）
            const sections = {
                '肉': [],
                '魚': [],
                '野菜': [],
                'その他': []
            };

            filtered.forEach(meal => {
                const high = getHighLevelCategory(meal.category);
                sections[high].push(meal);
            });

            const sectionOrder = ['肉', '魚', '野菜', 'その他'];
            const labels = {
                '肉': 'MEAT',
                '魚': 'FISH',
                '野菜': 'VEGETABLES',
                'その他': 'OTHERS'
            };

            let html = '';

            sectionOrder.forEach(highCat => {
                const items = sections[highCat];
                if (items.length === 0) return;

                html += `
                    <div class="menu-section">
                        <div class="menu-section-title">
                            ${highCat}のおかず
                            <span>${labels[highCat]} • ${items.length} items</span>
                        </div>
                        <div class="meal-grid">
                `;

                // itemsは filtered の要素なので元indexを探す
                items.forEach(meal => {
                    const originalIndex = meals.indexOf(meal);
                    const categoryClass = getCategoryClass(meal.category);
                    html += `
                        <div class="meal-item ${categoryClass}">
                            <div class="meal-header">
                                <div>
                                    <span class="meal-category ${categoryClass}">${meal.category}</span>
                                    ${meal.favorite ? '<span class="favorite-chip">★ お気に入り</span>' : ''}
                                </div>
                            </div>
                            <div class="meal-name">${escapeHtml(meal.name)}</div>
                            ${meal.mainIngredient ? `<div class="meal-ingredients"><strong>メイン食材:</strong> ${escapeHtml(meal.mainIngredient)}</div>` : ''}
                            ${meal.memo ? `<div class="meal-ingredients">${escapeHtml(meal.memo)}</div>` : ''}
                            <div class="date-info">
                                登録: ${formatDate(meal.createdAt)}${meal.lastAte ? ` ／ 最後に食べた日: ${formatDate(meal.lastAte)}` : ''}
                            </div>
                            <div class="meal-actions">
                                <button class="edit-btn" data-index="${originalIndex}">編集</button>
                                <button class="delete-btn" data-index="${originalIndex}">削除</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            mealsList.innerHTML = html;

            // 編集・削除ボタンのイベントを設定
            mealsList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = Number(btn.dataset.index);
                    editMeal(index);
                });
            });

            mealsList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = Number(btn.dataset.index);
                    deleteMeal(index);
                });
            });
        }

        // カテゴリーからクラス名を取得
        function getCategoryClass(category) {
            const categoryMap = {
                '牛': 'beef',
                '豚': 'pork',
                '鶏': 'chicken',
                '魚': 'fish',
                '野菜': 'vegetable',
                'その他': 'other'
            };
            return categoryMap[category] || 'other';
        }

        // 肉・魚・野菜・その他 の大分類を返す
        function getHighLevelCategory(category) {
            if (category === '魚') return '魚';
            if (category === '野菜') return '野菜';
            if (category === 'その他') return 'その他';
            // 牛・豚・鶏 などはすべて「肉」
            return '肉';
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 日付表示用
        function formatDate(value) {
            if (!value) return '';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return value;
            return d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // トースト表示
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2400);
        }

        // 編集機能
        window.editMeal = function(index) {
            const meal = meals[index];
            selectedCategory = meal.category;
            mealNameInput.value = meal.name;
            mainIngredientInput.value = meal.mainIngredient || '';
            memoInput.value = meal.memo || '';
            lastAteInput.value = meal.lastAte ? meal.lastAte.split('T')[0] || meal.lastAte : '';
            favoriteInput.checked = !!meal.favorite;
            
            // カテゴリーボタンを選択状態にする
            categoryButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === selectedCategory) {
                    btn.classList.add('active');
                }
            });

            editingIndex = index;
            saveBtn.textContent = '更新';
            
            // フォームまでスクロール
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        // 削除機能
        window.deleteMeal = function(index) {
            if (confirm('このおかずを削除しますか？')) {
                const target = meals[index];
                meals.splice(index, 1);
                // スプレッドシート削除（削除APIが未提供の場合はクライアント側のみ）
                try {
                    fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', id: target?.id })
                    }).catch(() => {});
                } catch (_) {}
                renderMeals();
                resetForm();
            }
        };

        // 全削除機能
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (meals.length === 0) {
                alert('削除するおかずがありません');
                return;
            }
            if (confirm('すべてのおかずを削除しますか？この操作は取り消せません。')) {
                meals = [];
                try {
                    fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'clear' })
                    }).catch(() => {});
                } catch (_) {}
                editingIndex = -1;
                resetForm();
                saveBtn.textContent = '保存';
                renderMeals();
            }
        });

        // 検索イベント
        searchInput.addEventListener('input', () => {
            searchKeyword = searchInput.value.trim();
            renderMeals();
        });

        // カテゴリーフィルターチップ
        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                filterCategory = chip.dataset.filter;
                renderMeals();
            });
        });

        // 今日のおかず提案ボタン
        suggestBtn.addEventListener('click', () => {
            const candidates = getFilteredMeals();
            if (candidates.length === 0) {
                alert('条件に合うおかずがありません。まずはメニューを登録してみましょう。');
                return;
            }
            const randomMeal = candidates[Math.floor(Math.random() * candidates.length)];
            const categoryClass = getCategoryClass(randomMeal.category);
            const high = getHighLevelCategory(randomMeal.category);

            suggestionArea.innerHTML = `
                <div class="suggestion-card">
                    <div class="suggestion-label">TODAY'S RECOMMEND</div>
                    <div class="suggestion-name">${escapeHtml(randomMeal.name)}</div>
                    <div class="suggestion-category ${categoryClass}">${high}・${randomMeal.category}</div>
                        ${randomMeal.mainIngredient ? `<div class="suggestion-ingredients"><strong>メイン食材:</strong> ${escapeHtml(randomMeal.mainIngredient)}</div>` : ''}
                        ${randomMeal.memo ? `<div class="suggestion-ingredients">${escapeHtml(randomMeal.memo)}</div>` : ''}
                </div>
            `;
        });

        // スプレッドシートから取得
        async function fetchMealsFromSheet() {
            isLoading = true;
            renderMeals();
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const rows = Array.isArray(data) ? data : (data.data || []);
                meals = rows.map(row => normalizeMeal(row)).filter(Boolean).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            } catch (e) {
                console.error(e);
                alert('読み込みに失敗しました。時間をおいて再度お試しください。');
            } finally {
                isLoading = false;
                renderMeals();
            }
        }

        // スプレッドシートへ保存
        async function saveMealToSheet(meal) {
            const payload = { action: 'upsert', ...meal };
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Failed to save');
            return res.json().catch(() => ({}));
        }

        // シートの行データを内部形式に整形
        function normalizeMeal(row) {
            if (!row) return null;
            // 行が配列形式の場合: [A,B,C,D,E,F,G,H]
            if (Array.isArray(row)) {
                return {
                    id: row[0] || `id-${Date.now()}`,
                    createdAt: row[1] || '',
                    category: row[2] || '',
                    name: row[3] || '',
                    mainIngredient: row[4] || '',
                    memo: row[5] || '',
                    favorite: row[6] === true || row[6] === 'TRUE' || row[6] === 'true' || row[6] === '1',
                    lastAte: row[7] || ''
                };
            }
            // オブジェクト形式の場合
            return {
                id: row.id || row.ID || `id-${Date.now()}`,
                createdAt: row.createdAt || row['登録日時'] || '',
                category: row.category || row['カテゴリー'] || '',
                name: row.name || row['料理名'] || '',
                mainIngredient: row.mainIngredient || row['メイン食材'] || '',
                memo: row.memo || row['メモ'] || '',
                favorite: row.favorite === true || row.favorite === 'TRUE' || row.favorite === 'true' || row.favorite === '1' || row['お気に入り'] === 'TRUE' || row['お気に入り'] === true,
                lastAte: row.lastAte || row['最後に食べた日'] || ''
            };
        }

        // ページ読み込み時にデータを読み込む
        fetchMealsFromSheet();
    </script>
</body>
</html>
