<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MyMeal おかず提案ツール</title>
    <link rel="manifest" href="manifest.json">
    <!-- CSSファイルの読み込み: レスポンシブデザインとモダンなスタイル -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>



<body>
    <div class="container">
        <h1>🍽️ MyMeal おかず提案ツール</h1>
        <p class="subtitle">その日の気分や冷蔵庫の中から、ぴったりのおかずをパッと決めるメニュー表</p>
        
        <div class="form-section">
            <div class="form-group">
                <label>ジャンル</label>
                <div class="genre-buttons">
                    <button type="button" class="genre-btn" data-genre="和食">🍱 和食</button>
                    <button type="button" class="genre-btn" data-genre="洋食">🍝 洋食</button>
                    <button type="button" class="genre-btn" data-genre="中華">🥟 中華</button>
                    <button type="button" class="genre-btn" data-genre="麺類">🍜 麺類</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>カテゴリー</label>
                <div class="category-buttons">
                    <button type="button" class="category-btn" data-category="牛">🐄 牛</button>
                    <button type="button" class="category-btn" data-category="豚">🐷 豚</button>
                    <button type="button" class="category-btn" data-category="鶏">🐔 鶏</button>
                    <button type="button" class="category-btn seafood" data-category="海鮮">🐟 海鮮</button>
                    <button type="button" class="category-btn" data-category="野菜">🥬 野菜</button>
                    <button type="button" class="category-btn" data-category="その他">🍽️ その他</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="mealName">料理名</label>
                <input type="text" id="mealName" placeholder="例：ハンバーグ定食">
            </div>
            
            <div class="form-group">
                <label for="mainIngredient">メイン食材</label>
                <input type="text" id="mainIngredient" placeholder="例：牛肉、玉ねぎ">
            </div>
            
            <div class="form-group">
                <label for="memo">メモ・材料</label>
                <textarea id="memo" placeholder="材料や作り方のメモを入力"></textarea>
            </div>
            
            <button type="button" class="save-btn" id="saveButton">保存</button>
        </div>
        
<div class="meals-section">
    <div class="meals-header">
        <div>
            <h2>おかずメニュー表</h2>
            <span class="menu-badge">TODAY'S SPECIAL</span>
        </div>
    </div>

    <div class="controls-row">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="食材名や料理名でさがす（例：鶏、にんじん、味噌）">
            <span class="search-icon">🔍</span>
        </div>

        <div class="filter-chips" id="filterChips">
            <button class="filter-chip active" data-filter="all">すべて</button>
            <button class="filter-chip" data-filter="牛">🐄 牛</button>
            <button class="filter-chip" data-filter="豚">🐷 豚</button>
            <button class="filter-chip" data-filter="鶏">🐔 鶏</button>
            <button class="filter-chip" data-filter="海鮮">🐟 海鮮</button>
            <button class="filter-chip" data-filter="野菜">🥬 野菜</button>
            <button class="filter-chip" data-filter="その他">🍽️ その他</button>
        </div>
    </div>
    
    <div class="suggestion-wrapper">
        <div class="suggestion-top">
            <div class="suggestion-title">今日のおかずを相談する</div>
            <button class="suggestion-btn" id="suggestBtn">
                🎲 今日のおかず
            </button>
        </div>
        <p class="suggestion-note">登録済みのおかずの中から、いまの条件に合う一品をランダムでご提案します。</p>
        <div id="suggestionArea"></div>
    </div>

    <!-- 履歴リスト: JavaScriptで動的に生成される
         各項目には以下の構造が含まれます:
         - 料理名と自動で入る日付を表示する場所 -->
    <div id="mealsList">
        <!-- 自動日時表示用の要素: JavaScriptで動的に生成される各カード内に
             料理名と日付（YYYY/MM/DD形式）が表示されます -->
    </div>
    </div>


    <script src="js/script.js"></script>

    <script>
      // ==========================================
      // Service Worker 登録と強制更新ロジック
      // ==========================================
      if ('serviceWorker' in navigator) {
        let registration = null;
        let refreshing = false;
        
        // Service Workerを登録
        navigator.serviceWorker.register('./service-worker.js', {
          updateViaCache: 'none' // 常に最新のService Workerを取得
        })
        .then(reg => {
          registration = reg;
          console.log('✅ PWA: Service Worker登録成功！');
          console.log(`📦 キャッシュバージョン: ${reg.scope}`);
          
          // 初回登録時は即座に更新チェック
          reg.update();
          
          // Service Workerの更新を検知
          reg.addEventListener('updatefound', () => {
            console.log('🔄 新しいService Workerが検出されました');
            const newWorker = reg.installing;
            
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // 新しいService Workerがインストールされ、現在のページが制御されている場合
                  console.log('🔄 新しいバージョンが利用可能です');
                  
                  // ユーザーに更新を促す
                  if (confirm('新しいバージョンが利用可能です。ページを更新しますか？')) {
                    // 新しいService Workerに制御を移す
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    // ページをリロード
                    window.location.reload();
                  }
                } else if (newWorker.state === 'activated') {
                  // 新しいService Workerがアクティブになった場合
                  console.log('✅ 新しいService Workerがアクティブになりました');
                  if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                  }
                }
              });
            }
          });
          
          // 定期的に更新をチェック（5分ごと）
          setInterval(() => {
            console.log('🔄 定期的な更新チェックを実行');
            reg.update();
          }, 5 * 60 * 1000); // 5分 = 300,000ミリ秒
        })
        .catch(err => {
          console.error('❌ PWA: Service Worker登録失敗', err);
        });
        
        // Service Workerのコントローラー変更を検知（ページリロードなしで更新）
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            console.log('🔄 Service Workerコントローラーが変更されました');
            refreshing = true;
            window.location.reload();
          }
        });
        
        // ページがフォーカスされた時に更新をチェック
        window.addEventListener('focus', () => {
          if (registration) {
            console.log('🔄 ページフォーカス時に更新チェック');
            registration.update();
          }
        });
        
        // 手動で更新チェックを実行する関数（グローバルスコープに公開）
        window.checkServiceWorkerUpdate = () => {
          if (registration) {
            console.log('🔄 手動で更新チェックを実行');
            registration.update()
              .then(() => {
                console.log('✅ 更新チェック完了');
                alert('更新チェックが完了しました。新しいバージョンがある場合は、ページが自動的にリロードされます。');
              })
              .catch(err => {
                console.error('❌ 更新チェックエラー:', err);
                alert('更新チェック中にエラーが発生しました。');
              });
          } else {
            alert('Service Workerが登録されていません。');
          }
        };
      } else {
        console.warn('⚠️ Service Workerがサポートされていません');
      }
    </script>
</body>
</html>
